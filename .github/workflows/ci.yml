name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: invoice_ops
          POSTGRES_PASSWORD: invoice_ops
          POSTGRES_DB: invoice_ops
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U invoice_ops"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://invoice_ops:invoice_ops@localhost:5432/invoice_ops
      CELERY_TASK_ALWAYS_EAGER: "false"
      CELERY_BROKER_URL: redis://localhost:6379/0
      CELERY_RESULT_BACKEND: redis://localhost:6379/1
      STORAGE_BACKEND: local
      STORAGE_LOCAL_DIR: ./_storage
      APP_ENV: ci

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Sync dependencies
        run: uv sync

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Mypy
        run: uv run mypy src

      - name: Alembic upgrade
        run: uv run alembic upgrade head

      - name: Tests
        run: uv run pytest
