# Optional prod-shaped infra for contributors who have Docker.
# Dev works WITHOUT this (SQLite + eager queue + local storage).
#
# With `docker compose up -d`, put this in .env:
#   DATABASE_URL=postgresql+psycopg://invoice_ops:invoice_ops@localhost:5432/invoice_ops
#   CELERY_TASK_ALWAYS_EAGER=false
#   CELERY_BROKER_URL=redis://localhost:6379/0
#   CELERY_RESULT_BACKEND=redis://localhost:6379/1
#   STORAGE_BACKEND=s3
#   S3_ENDPOINT_URL=http://localhost:9000
#   S3_ACCESS_KEY=minioadmin
#   S3_SECRET_KEY=minioadmin

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: invoice_ops
      POSTGRES_PASSWORD: invoice_ops
      POSTGRES_DB: invoice_ops
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U invoice_ops"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/invoice-ops &&
      echo 'bucket ready'
      "

volumes:
  pgdata:
  miniodata:
